<div class="loans-header">
  <h1>Préstamos</h1>
  <div class="header-actions">
    <button mat-stroked-button color="primary" (click)="openSimulationDialog()">
      <mat-icon>calculate</mat-icon> Simular crédito
    </button>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon> Nuevo préstamo
    </button>
  </div>
</div>

<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<table mat-table [dataSource]="dataSource" *ngIf="!loading" class="mat-elevation-z2 full-width">
  <ng-container matColumnDef="reference">
    <th mat-header-cell *matHeaderCellDef>Referencia</th>
    <td mat-cell *matCellDef="let l">{{ l.reference }}</td>
  </ng-container>

  <ng-container matColumnDef="customerDocumentNumber">
    <th mat-header-cell *matHeaderCellDef>Cliente (doc.)</th>
    <td mat-cell *matCellDef="let l">{{ l.customerDocumentNumber }}</td>
  </ng-container>

  <ng-container matColumnDef="vehicleIdentifier">
    <th mat-header-cell *matHeaderCellDef>Vehículo</th>
    <td mat-cell *matCellDef="let l">{{ l.vehicleIdentifier }}</td>
  </ng-container>

  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Monto</th>
    <td mat-cell *matCellDef="let l">{{ l.amount | copCurrency }}</td>
  </ng-container>

  <ng-container matColumnDef="installments">
    <th mat-header-cell *matHeaderCellDef>Plazo</th>
    <td mat-cell *matCellDef="let l">{{ getTermMonths(l.installments) }} meses</td>
  </ng-container>

  <ng-container matColumnDef="dateCreation">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let l">{{ l.dateCreation | date:'dd/MM/yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let l">
      <button mat-icon-button color="warn" (click)="deleteLoan(l, $event)" matTooltip="Eliminar", aria-label="Eliminar préstamo">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="viewDetail(row)" class="clickable-row"></tr>
</table>

<p *ngIf="!loading && dataSource.data.length === 0" class="empty-state">No hay préstamos registrados aún.</p>
