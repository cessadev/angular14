<div class="loans-header">
  <h1>Préstamos</h1>
  <div class="header-actions">
    <button mat-stroked-button color="primary" (click)="openSimulationDialog()">
      <mat-icon>calculate</mat-icon> Simular crédito
    </button>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon> Nuevo préstamo
    </button>
  </div>
</div>

<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<div class="data-list" *ngIf="!loading">
  <div class="data-row data-row--clickable" *ngFor="let l of loans" (click)="viewDetail(l)">
    <div class="data-row__field"><span class="data-row__label">Referencia</span>{{ l.reference }}</div>
    <div class="data-row__field"><span class="data-row__label">Cliente (doc.)</span>{{ l.customerDocumentNumber }}</div>
    <div class="data-row__field"><span class="data-row__label">Vehículo</span>{{ l.vehicleIdentifier }}</div>
    <div class="data-row__field"><span class="data-row__label">Monto</span>{{ l.amount | copCurrency }}</div>
    <div class="data-row__field"><span class="data-row__label">Plazo</span>{{ getTermMonths(l.installments) }} meses</div>
    <div class="data-row__field"><span class="data-row__label">Fecha</span>{{ l.dateCreation | date:'dd/MM/yyyy' }}</div>
    <div class="data-row__actions">
      <button mat-icon-button color="warn" (click)="deleteLoan(l, $event)" matTooltip="Eliminar" aria-label="Eliminar préstamo">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
</div>

<p *ngIf="!loading && loans.length === 0" class="empty-state">No hay préstamos registrados aún.</p>
