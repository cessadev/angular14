<h2 class="dialog-title">Nuevo préstamo</h2>

<div *ngIf="loadingOptions" class="loading-container">
  <app-spinner [size]="32"></app-spinner>
</div>

<p *ngIf="!loadingOptions && loadError" class="error-text">
  No se pudieron cargar clientes/vehículos. Cierra e intenta de nuevo.
</p>

<form *ngIf="!loadingOptions && !loadError" [formGroup]="form" (ngSubmit)="save()">
  <div class="dialog-content">
    <div class="field field--full">
      <label class="field__label" for="loan-customer">Cliente</label>
      <div class="field__control-wrap">
        <select id="loan-customer" class="field__select" formControlName="customerDocumentNumber">
          <option *ngFor="let c of customers" [value]="c.documentNumber">
            {{ c.name }} {{ c.lastname }} — {{ c.documentNumber }}
          </option>
        </select>
      </div>
      <span class="field__error" *ngIf="customers.length === 0">No hay clientes registrados</span>
    </div>

    <div class="field field--full">
      <label class="field__label" for="loan-vehicle">Vehículo</label>
      <div class="field__control-wrap">
        <select id="loan-vehicle" class="field__select" formControlName="vehicleIdentifier">
          <option *ngFor="let v of vehicles" [value]="v.identifier">
            {{ v.identifier }} — {{ v.brand }} {{ v.model }} ({{ v.year }})
          </option>
        </select>
      </div>
      <span class="field__error" *ngIf="vehicles.length === 0">No hay vehículos registrados</span>
    </div>

    <div class="field field--full">
      <label class="field__label" for="loan-amount">Monto del préstamo</label>
      <div class="field__control-wrap">
        <span class="field__prefix">$</span>
        <input id="loan-amount" class="field__input has-prefix" type="number" formControlName="amount">
      </div>
    </div>

    <div class="field field--full">
      <label class="field__label" for="loan-term">Plazo</label>
      <div class="field__control-wrap">
        <select id="loan-term" class="field__select" formControlName="installments">
          <option *ngFor="let term of terms" [value]="term">{{ termMonths[term] }} meses</option>
        </select>
      </div>
    </div>
  </div>

  <div class="dialog-actions dialog-actions--end">
    <button class="btn btn--text" type="button" (click)="cancel()">Cancelar</button>
    <button class="btn btn--primary" type="submit"
            [disabled]="customers.length === 0 || vehicles.length === 0">
      Guardar
    </button>
  </div>
</form>
