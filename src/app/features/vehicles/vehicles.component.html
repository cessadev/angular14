<div class="vehicles-header">
  <h1>Vehículos</h1>
  <button class="btn btn--primary" (click)="openCreateDialog()">
    <app-icon name="add"></app-icon> Nuevo vehículo
  </button>
</div>

<div class="field search-field">
  <label class="field__label" for="vehicle-search">Buscar por identificador</label>
  <div class="field__control-wrap">
    <input id="vehicle-search" class="field__input has-suffix" [formControl]="searchControl" placeholder="Ej. ABC123">
    <app-icon class="field__suffix" name="search"></app-icon>
  </div>
</div>

<div class="table-wrap">
  <div class="table__header table--vehicles">
    <span>Identificador</span>
    <span>Marca</span>
    <span>Modelo</span>
    <span>Año</span>
    <span>Valor de mercado</span>
    <span></span>
  </div>

  <app-table-skeleton *ngIf="loading" gridClass="table--vehicles" [columns]="6"></app-table-skeleton>

  <ng-container *ngIf="!loading">
    <div class="table__row table--vehicles" *ngFor="let v of filteredVehicles">
      <span class="table__cell">{{ v.identifier }}</span>
      <span class="table__cell">{{ v.brand }}</span>
      <span class="table__cell">{{ v.model }}</span>
      <span class="table__cell">{{ v.year }}</span>
      <span class="table__cell">{{ v.marketValue | copCurrency }}</span>
      <div class="table__cell table__cell--actions">
        <button class="icon-button icon-button--primary" (click)="openEditDialog(v)" appTooltip="Editar" aria-label="Editar vehículo">
          <app-icon name="edit"></app-icon>
        </button>
        <button class="icon-button icon-button--danger" (click)="deleteVehicle(v)" appTooltip="Eliminar" aria-label="Eliminar vehículo">
          <app-icon name="delete"></app-icon>
        </button>
      </div>
    </div>
  </ng-container>
</div>

<p *ngIf="!loading && filteredVehicles.length === 0" class="empty-state">No hay vehículos registrados aún.</p>
