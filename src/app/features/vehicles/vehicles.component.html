<div class="vehicles-header">
  <h1>Vehículos</h1>
  <button class="btn btn--primary" (click)="openCreateDialog()">
    <app-icon name="add"></app-icon> Nuevo vehículo
  </button>
</div>

<div class="field search-field">
  <label class="field__label" for="vehicle-search">Buscar por identificador</label>
  <div class="field__control-wrap">
    <input id="vehicle-search" class="field__input has-suffix" [formControl]="searchControl" placeholder="Ej. ABC123">
    <app-icon class="field__suffix" name="search"></app-icon>
  </div>
</div>

<div *ngIf="loading" class="loading-container">
  <app-spinner [size]="40"></app-spinner>
</div>

<div class="data-list" *ngIf="!loading">
  <div class="data-row" *ngFor="let v of filteredVehicles">
    <div class="data-row__field"><span class="data-row__label">Identificador</span>{{ v.identifier }}</div>
    <div class="data-row__field"><span class="data-row__label">Marca</span>{{ v.brand }}</div>
    <div class="data-row__field"><span class="data-row__label">Modelo</span>{{ v.model }}</div>
    <div class="data-row__field"><span class="data-row__label">Año</span>{{ v.year }}</div>
    <div class="data-row__field"><span class="data-row__label">Valor de mercado</span>{{ v.marketValue | copCurrency }}</div>
    <div class="data-row__actions">
      <button class="icon-button icon-button--primary" (click)="openEditDialog(v)" matTooltip="Editar" aria-label="Editar vehículo">
        <app-icon name="edit"></app-icon>
      </button>
      <button class="icon-button icon-button--danger" (click)="deleteVehicle(v)" matTooltip="Eliminar" aria-label="Eliminar vehículo">
        <app-icon name="delete"></app-icon>
      </button>
    </div>
  </div>
</div>

<p *ngIf="!loading && filteredVehicles.length === 0" class="empty-state">No hay vehículos registrados aún.</p>
