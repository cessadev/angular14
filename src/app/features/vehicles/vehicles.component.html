<div class="vehicles-header">
  <h1>Vehículos</h1>
  <button mat-raised-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon> Nuevo vehículo
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Buscar por identificador</mat-label>
  <input matInput [formControl]="searchControl" placeholder="Ej. ABC123">
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<table mat-table [dataSource]="dataSource" *ngIf="!loading" class="mat-elevation-z2 full-width">
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let v">
      <button mat-icon-button color="primary" (click)="openEditDialog(v)" matTooltip="Editar" aria-label="Editar vehículo">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="identifier">
    <th mat-header-cell *matHeaderCellDef>Identificador</th>
    <td mat-cell *matCellDef="let v">{{ v.identifier }}</td>
  </ng-container>

  <ng-container matColumnDef="brand">
    <th mat-header-cell *matHeaderCellDef>Marca</th>
    <td mat-cell *matCellDef="let v">{{ v.brand }}</td>
  </ng-container>

  <ng-container matColumnDef="model">
    <th mat-header-cell *matHeaderCellDef>Modelo</th>
    <td mat-cell *matCellDef="let v">{{ v.model }}</td>
  </ng-container>

  <ng-container matColumnDef="year">
    <th mat-header-cell *matHeaderCellDef>Año</th>
    <td mat-cell *matCellDef="let v">{{ v.year }}</td>
  </ng-container>

  <ng-container matColumnDef="marketValue">
    <th mat-header-cell *matHeaderCellDef>Valor de mercado</th>
    <td mat-cell *matCellDef="let v">{{ v.marketValue | copCurrency }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<p *ngIf="!loading && dataSource.filteredData.length === 0" class="empty-state">No hay vehículos registrados aún.</p>
