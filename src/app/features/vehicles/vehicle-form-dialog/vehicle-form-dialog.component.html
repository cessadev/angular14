<h2 mat-dialog-title>Nuevo vehículo</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Identificador / Placa</mat-label>
      <input matInput formControlName="identifier">
      <mat-error *ngIf="form.get('identifier')?.hasError('required')">Requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Marca</mat-label>
      <mat-select formControlName="brand">
        <mat-option *ngFor="let brand of brands" [value]="brand">{{ brand }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Modelo</mat-label>
      <input matInput formControlName="model" placeholder="Ej. Corolla, Sportage...">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Valor de mercado</mat-label>
      <span matPrefix>$&nbsp;</span>
      <input matInput type="number" formControlName="marketValue">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Año</mat-label>
      <input matInput type="number" formControlName="year">
      <mat-error *ngIf="form.get('year')?.hasError('max')">
        No puede ser mayor a {{ currentYear + 1 }}
      </mat-error>
      <mat-error *ngIf="form.get('year')?.hasError('min')">Debe ser mayor a 1990</mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit">Guardar</button>
  </mat-dialog-actions>
</form>
