<h2 class="dialog-title">{{ isEditMode ? 'Editar cliente' : 'Nuevo cliente' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="dialog-content">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tipo de documento</mat-label>
      <mat-select formControlName="documentType">
        <mat-option *ngFor="let type of documentTypes" [value]="type">
          {{ documentTypeLabels[type] }}
        </mat-option>
      </mat-select>
      <mat-hint *ngIf="isEditMode">No editable</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Número de documento</mat-label>
      <input matInput type="number" formControlName="documentNumber">
      <mat-error *ngIf="form.get('documentNumber')?.hasError('required')">Requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Apellido</mat-label>
      <input matInput formControlName="lastname">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Edad</mat-label>
      <input matInput type="number" formControlName="age">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Dirección</mat-label>
      <input matInput formControlName="address">
    </mat-form-field>
  </div>

  <div class="dialog-actions dialog-actions--end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit">Guardar</button>
  </div>
</form>
