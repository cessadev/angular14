<div class="customers-header">
  <h1>Clientes</h1>
  <button mat-raised-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon> Nuevo cliente
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Buscar por número de documento</mat-label>
  <input matInput [formControl]="searchControl" placeholder="Ej. 1002345678">
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<table mat-table [dataSource]="dataSource" *ngIf="!loading" class="mat-elevation-z2 full-width">
  <ng-container matColumnDef="documentType">
    <th mat-header-cell *matHeaderCellDef>Tipo doc.</th>
    <td mat-cell *matCellDef="let c">{{ getDocumentTypeLabel(c.documentType) }}</td>
  </ng-container>

  <ng-container matColumnDef="documentNumber">
    <th mat-header-cell *matHeaderCellDef>Número</th>
    <td mat-cell *matCellDef="let c">{{ c.documentNumber }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let c">{{ c.name }}</td>
  </ng-container>

  <ng-container matColumnDef="lastname">
    <th mat-header-cell *matHeaderCellDef>Apellido</th>
    <td mat-cell *matCellDef="let c">{{ c.lastname }}</td>
  </ng-container>

  <ng-container matColumnDef="age">
    <th mat-header-cell *matHeaderCellDef>Edad</th>
    <td mat-cell *matCellDef="let c">{{ c.age }}</td>
  </ng-container>

  <ng-container matColumnDef="address">
    <th mat-header-cell *matHeaderCellDef>Dirección</th>
    <td mat-cell *matCellDef="let c">{{ c.address }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let c">
      <button mat-icon-button (click)="openLoansDialog(c)" matTooltip="Ver créditos" aria-label="Ver créditos del cliente">
        <mat-icon>request_quote</mat-icon>
      </button>
      <button mat-icon-button color="primary" (click)="openEditDialog(c)" matTooltip="Editar" aria-label="Editar cliente">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteCustomer(c)" matTooltip="Eliminar" aria-label="Eliminar cliente">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<p *ngIf="!loading && dataSource.filteredData.length === 0" class="empty-state">No hay clientes registrados aún.</p>
