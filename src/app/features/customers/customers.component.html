<div class="customers-header">
  <h1>Clientes</h1>
  <button class="btn btn--primary" (click)="openCreateDialog()">
    <app-icon name="add"></app-icon> Nuevo cliente
  </button>
</div>

<div class="field search-field">
  <label class="field__label" for="customer-search">Buscar por número de documento</label>
  <div class="field__control-wrap">
    <input id="customer-search" class="field__input has-suffix" [formControl]="searchControl" placeholder="Ej. 1002345678">
    <app-icon class="field__suffix" name="search"></app-icon>
  </div>
</div>

<div *ngIf="loading" class="loading-container">
  <app-spinner [size]="40"></app-spinner>
</div>

<div class="table-wrap" *ngIf="!loading">
  <div class="table__header table--customers">
    <span>Tipo doc.</span>
    <span>Número</span>
    <span>Nombre</span>
    <span>Apellido</span>
    <span>Edad</span>
    <span>Dirección</span>
    <span></span>
  </div>
  <div class="table__row table--customers" *ngFor="let c of filteredCustomers">
    <span class="table__cell">{{ getDocumentTypeLabel(c.documentType) }}</span>
    <span class="table__cell">{{ c.documentNumber }}</span>
    <span class="table__cell">{{ c.name }}</span>
    <span class="table__cell">{{ c.lastname }}</span>
    <span class="table__cell">{{ c.age }}</span>
    <span class="table__cell">{{ c.address }}</span>
    <div class="table__cell table__cell--actions">
      <button class="icon-button" (click)="openLoansDialog(c)" appTooltip="Ver créditos" aria-label="Ver créditos del cliente">
        <app-icon name="quote"></app-icon>
      </button>
      <button class="icon-button icon-button--primary" (click)="openEditDialog(c)" appTooltip="Editar" aria-label="Editar cliente">
        <app-icon name="edit"></app-icon>
      </button>
      <button class="icon-button icon-button--danger" (click)="deleteCustomer(c)" appTooltip="Eliminar" aria-label="Eliminar cliente">
        <app-icon name="delete"></app-icon>
      </button>
    </div>
  </div>
</div>

<p *ngIf="!loading && filteredCustomers.length === 0" class="empty-state">No hay clientes registrados aún.</p>
