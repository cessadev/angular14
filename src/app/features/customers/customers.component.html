<div class="customers-header">
  <h1>Clientes</h1>
  <button mat-raised-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon> Nuevo cliente
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Buscar por número de documento</mat-label>
  <input matInput [formControl]="searchControl" placeholder="Ej. 1002345678">
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<div class="data-list" *ngIf="!loading">
  <div class="data-row" *ngFor="let c of filteredCustomers">
    <div class="data-row__field"><span class="data-row__label">Tipo doc.</span>{{ getDocumentTypeLabel(c.documentType) }}</div>
    <div class="data-row__field"><span class="data-row__label">Número</span>{{ c.documentNumber }}</div>
    <div class="data-row__field"><span class="data-row__label">Nombre</span>{{ c.name }}</div>
    <div class="data-row__field"><span class="data-row__label">Apellido</span>{{ c.lastname }}</div>
    <div class="data-row__field"><span class="data-row__label">Edad</span>{{ c.age }}</div>
    <div class="data-row__field"><span class="data-row__label">Dirección</span>{{ c.address }}</div>
    <div class="data-row__actions">
      <button mat-icon-button (click)="openLoansDialog(c)" matTooltip="Ver créditos" aria-label="Ver créditos del cliente">
        <mat-icon>request_quote</mat-icon>
      </button>
      <button mat-icon-button color="primary" (click)="openEditDialog(c)" matTooltip="Editar" aria-label="Editar cliente">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteCustomer(c)" matTooltip="Eliminar" aria-label="Eliminar cliente">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
</div>

<p *ngIf="!loading && filteredCustomers.length === 0" class="empty-state">No hay clientes registrados aún.</p>
