<h2 class="dialog-title">Registrar pago — Cuota {{ data.installment.number }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="dialog-content">
    <p>Saldo pendiente: <strong>{{ remainingBalance | copCurrency }}</strong></p>

    <div class="field field--full">
      <label class="field__label" for="payment-method">Método de pago</label>
      <div class="field__control-wrap">
        <select id="payment-method" class="field__select" formControlName="method">
          <option *ngFor="let m of methods" [value]="m">{{ methodLabels[m] }}</option>
        </select>
      </div>
      <span
        class="field__error"
        *ngIf="
          form.get('method')?.hasError('required') &&
          form.get('method')?.touched
        "
      >
        Requerido
      </span>
    </div>

    <div class="field field--full">
      <label class="field__label" for="payment-amount">Monto a pagar</label>
      <div class="field__control-wrap">
        <span class="field__prefix">$</span>
        <input id="payment-amount" class="field__input has-prefix" type="text" inputmode="numeric" appNumericFormat formControlName="amount">
      </div>
      <span
        class="field__error"
        *ngIf="
          form.get('amount')?.hasError('required') &&
          form.get('amount')?.touched
        "
      >
        Requerido
      </span>
      <span class="field__error" *ngIf="form.get('amount')?.hasError('min')">
        Debe ser mayor a cero
      </span>
      <span class="field__error" *ngIf="form.get('amount')?.hasError('max')">
        No puede exceder el saldo pendiente
      </span>
    </div>
  </div>

  <div class="dialog-actions dialog-actions--end">
    <button class="btn btn--text" type="button" (appLiquidDialogClose)="cancel()">Cancelar</button>
    <button class="btn btn--primary" type="submit">Registrar pago</button>
  </div>
</form>
