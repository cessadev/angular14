<button mat-button (click)="goBack()" class="back-button">
  <mat-icon>arrow_back</mat-icon> Volver al préstamo
</button>

<h1>Cuotas del préstamo {{ loanReference }}</h1>

<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<table mat-table [dataSource]="installments" *ngIf="!loading" class="mat-elevation-z2 full-width">
  <ng-container matColumnDef="number">
    <th mat-header-cell *matHeaderCellDef>Cuota #</th>
    <td mat-cell *matCellDef="let i">{{ i.number }}</td>
  </ng-container>

  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Valor cuota</th>
    <td mat-cell *matCellDef="let i">{{ i.amount | copCurrency }}</td>
  </ng-container>

  <ng-container matColumnDef="amountPaid">
    <th mat-header-cell *matHeaderCellDef>Pagado</th>
    <td mat-cell *matCellDef="let i">{{ i.amountPaid | copCurrency }}</td>
  </ng-container>

  <ng-container matColumnDef="dateExpiration">
    <th mat-header-cell *matHeaderCellDef>Vencimiento</th>
    <td mat-cell *matCellDef="let i">{{ i.dateExpiration | date:'dd/MM/yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let i">
      <mat-chip-list>
        <mat-chip [color]="status(i) === 'paid' ? 'primary' : status(i) === 'overdue' ? 'warn' : undefined"
                  [selected]="status(i) !== 'pending'">
          {{ statusLabel(status(i)) }}
        </mat-chip>
      </mat-chip-list>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let i">
      <button mat-icon-button color="primary" (click)="viewPayments(i)" matTooltip="Ver pagos" aria-label="Ver pagos de la cuota">
        <mat-icon>receipt_long</mat-icon>
      </button>
      <button mat-raised-button color="primary" *ngIf="!i.paid" (click)="openPaymentDialog(i)">
        Registrar pago
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
