<button class="back-button btn btn--text" appLiquidTap (click)="goBack()">
  <app-icon name="arrow-back"></app-icon> Volver al préstamo
</button>

<h1>Cuotas del préstamo {{ loanReference }}</h1>

<div class="table-wrap">
  <div class="table__header table--loan-installments">
    <span>Cuota</span>
    <span>Valor cuota</span>
    <span>Pagado</span>
    <span>Vencimiento</span>
    <span>Estado</span>
    <span></span>
  </div>

  <app-table-skeleton *ngIf="loading" gridClass="table--loan-installments" [columns]="6"></app-table-skeleton>

  <ng-container *ngIf="!loading">
    <div class="table__row table--loan-installments" *ngFor="let i of installments">
      <span class="table__cell">{{ i.number }}</span>
      <span class="table__cell">{{ i.amount | copCurrency }}</span>
      <span class="table__cell">{{ i.amountPaid | copCurrency }}</span>
      <span class="table__cell">{{ i.dateExpiration | date:'dd/MM/yyyy' }}</span>
      <span class="table__cell">
        <span class="badge" [ngClass]="{
          'badge--primary': status(i) === 'paid',
          'badge--warn': status(i) === 'overdue'
        }">{{ statusLabel(status(i)) }}</span>
      </span>
      <div class="table__cell table__cell--actions">
        <button class="icon-button icon-button--primary" (click)="viewPayments(i)" appTooltip="Ver pagos" aria-label="Ver pagos de la cuota">
          <app-icon name="receipt"></app-icon>
        </button>
        <button class="btn btn--primary" *ngIf="!i.paid" (click)="openPaymentDialog(i)">
          Registrar pago
        </button>
      </div>
    </div>
  </ng-container>
</div>
