<h1>Cuotas en mora</h1>

<div *ngIf="loading" class="loading-container">
  <app-spinner [size]="40"></app-spinner>
</div>

<div class="data-list" *ngIf="!loading">
  <div class="data-row data-row--clickable" *ngFor="let i of items" (click)="viewLoan(i)">
    <div class="data-row__field"><span class="data-row__label">Préstamo</span>{{ i.loanReference }}</div>
    <div class="data-row__field"><span class="data-row__label">Cuota #</span>{{ i.number }}</div>
    <div class="data-row__field"><span class="data-row__label">Cliente</span>{{ i.customer }}</div>
    <div class="data-row__field"><span class="data-row__label">Vehículo</span>{{ i.vehicle }}</div>
    <div class="data-row__field"><span class="data-row__label">Monto</span>{{ i.amount | copCurrency }}</div>
    <div class="data-row__field"><span class="data-row__label">Vencimiento</span>{{ i.dateExpiration | date:'dd/MM/yyyy' }}</div>
    <span class="badge badge--warn">{{ i.daysOverdue }} días en mora</span>
  </div>
</div>

<p *ngIf="!loading && items.length === 0" class="empty-state">No hay cuotas en mora actualmente.</p>
