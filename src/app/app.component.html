<div class="app-shell">
  <aside
    class="app-sidenav glass-surface"
    [class.app-sidenav--overlay]="isMobile$ | async"
    [class.app-sidenav--open]="sidenavOpen"
  >
    <div class="sidenav-header">
      <span class="brand">CarCredit</span>
    </div>
    <nav class="sidenav-nav">
      <a
        *ngFor="let link of navLinks"
        [routerLink]="link.path"
        routerLinkActive="active-link"
        class="sidenav-link"
        appLiquidTap
        (click)="closeIfMobile()"
      >
        <app-icon [name]="link.icon" [size]="20"></app-icon>
        <span>{{ link.label }}</span>
      </a>
    </nav>

    <div class="sidenav-footer">
      <button
        type="button"
        class="sidenav-link sidenav-theme-toggle"
        appLiquidTap
        (click)="toggleTheme()"
        [attr.aria-label]="(isLight$ | async) ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'"
      >
        <app-icon [name]="(isLight$ | async) ? 'moon' : 'sun'" [size]="20"></app-icon>
        <span>{{ (isLight$ | async) ? 'Modo oscuro' : 'Modo claro' }}</span>
      </button>
    </div>
  </aside>

  <div class="app-backdrop" *ngIf="(isMobile$ | async) && sidenavOpen" (click)="closeIfMobile()"></div>

  <div class="app-main">
    <header class="app-toolbar glass-surface" *ngIf="isMobile$ | async">
      <button
        class="icon-button"
        (click)="toggleSidenav()"
        aria-label="Abrir menú de navegación"
      >
        <app-icon name="menu" [size]="22"></app-icon>
      </button>
      <span class="brand">CarCredit</span>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
