<h2 class="dialog-title">{{ data.title }}</h2>
<div class="dialog-content">{{ data.message }}</div>
<div class="dialog-actions dialog-actions--end">
  <button class="btn btn--text" (click)="cancel()">Cancelar</button>
  <button class="btn btn--danger" (click)="confirm()">
    {{ data.confirmLabel ?? 'Eliminar' }}
  </button>
</div>
