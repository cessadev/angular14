<div class="feedback-dialog" [class.feedback-success]="data.type === 'success'" [class.feedback-error]="data.type === 'error'">
  <mat-icon class="feedback-icon">{{ data.type === 'success' ? 'check_circle' : 'error' }}</mat-icon>

  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content>{{ data.message }}</mat-dialog-content>

  <mat-dialog-actions align="center">
    <button mat-raised-button [color]="data.type === 'success' ? 'primary' : 'warn'" mat-dialog-close>
      Aceptar
    </button>
  </mat-dialog-actions>
</div>
