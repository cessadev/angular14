<div class="feedback-dialog" [class.feedback-success]="data.type === 'success'" [class.feedback-error]="data.type === 'error'">
  <app-icon class="feedback-icon" [name]="data.type === 'success' ? 'check-circle' : 'error'" [size]="32"></app-icon>

  <h2 class="dialog-title">{{ data.title }}</h2>
  <div class="dialog-content">{{ data.message }}</div>

  <div class="dialog-actions dialog-actions--center">
    <button mat-raised-button [color]="data.type === 'success' ? 'primary' : 'warn'" (click)="close()">
      Aceptar
    </button>
  </div>
</div>
