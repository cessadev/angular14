<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  [ngSwitch]="name"
>
  <ng-container *ngSwitchCase="'menu'">
    <line x1="4" y1="7" x2="20" y2="7"></line>
    <line x1="4" y1="12" x2="20" y2="12"></line>
    <line x1="4" y1="17" x2="20" y2="17"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'search'">
    <circle cx="10.5" cy="10.5" r="6.5"></circle>
    <line x1="20" y1="20" x2="15.3" y2="15.3"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'add'">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'edit'">
    <path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15v5z"></path>
  </ng-container>

  <ng-container *ngSwitchCase="'delete'">
    <path d="M5 7h14"></path>
    <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
    <path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"></path>
  </ng-container>

  <ng-container *ngSwitchCase="'arrow-back'">
    <line x1="19" y1="12" x2="5" y2="12"></line>
    <polyline points="11 6 5 12 11 18"></polyline>
  </ng-container>

  <ng-container *ngSwitchCase="'calculate'">
    <rect x="4" y="3" width="16" height="18" rx="2"></rect>
    <line x1="8" y1="7" x2="16" y2="7"></line>
    <line x1="8" y1="12" x2="8" y2="12.01"></line>
    <line x1="12" y1="12" x2="12" y2="12.01"></line>
    <line x1="16" y1="12" x2="16" y2="12.01"></line>
    <line x1="8" y1="16" x2="8" y2="16.01"></line>
    <line x1="12" y1="16" x2="12" y2="16.01"></line>
    <line x1="16" y1="16" x2="16" y2="16.01"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'receipt'">
    <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"></path>
    <line x1="9" y1="8" x2="15" y2="8"></line>
    <line x1="9" y1="12" x2="15" y2="12"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'quote'">
    <path d="M6 3h9l3 3v15H6z"></path>
    <path d="M15 3v3h3"></path>
    <line x1="9" y1="13" x2="15" y2="13"></line>
    <line x1="9" y1="17" x2="13" y2="17"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'check-circle'">
    <circle cx="12" cy="12" r="9"></circle>
    <polyline points="8 12 11 15 16 9"></polyline>
  </ng-container>

  <ng-container *ngSwitchCase="'error'">
    <circle cx="12" cy="12" r="9"></circle>
    <line x1="12" y1="8" x2="12" y2="13"></line>
    <line x1="12" y1="16" x2="12" y2="16.01"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'dashboard'">
    <rect x="4" y="4" width="7" height="7" rx="1.5"></rect>
    <rect x="13" y="4" width="7" height="7" rx="1.5"></rect>
    <rect x="4" y="13" width="7" height="7" rx="1.5"></rect>
    <rect x="13" y="13" width="7" height="7" rx="1.5"></rect>
  </ng-container>

  <ng-container *ngSwitchCase="'people'">
    <circle cx="9" cy="8" r="3"></circle>
    <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path>
    <circle cx="17" cy="9" r="2.5"></circle>
    <path d="M21 20c0-2.5-1.8-4.6-4.2-5.3"></path>
  </ng-container>

  <ng-container *ngSwitchCase="'car'">
    <path d="M4 16V11l2-5h12l2 5v5"></path>
    <path d="M4 16h16"></path>
    <circle cx="7.5" cy="16.5" r="1.5"></circle>
    <circle cx="16.5" cy="16.5" r="1.5"></circle>
  </ng-container>

  <ng-container *ngSwitchCase="'payments'">
    <rect x="3" y="6" width="18" height="12" rx="2"></rect>
    <line x1="3" y1="10" x2="21" y2="10"></line>
    <line x1="6" y1="14" x2="10" y2="14"></line>
  </ng-container>
</svg>
